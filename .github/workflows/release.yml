name: Omnia AI — Build & Release

on:
  push:
    tags:
      - 'v*'           # v1.0.0, v1.1.0, etc.
  workflow_dispatch:   # allow a manual run for testing the pipeline

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      # Single source of truth: the same script a developer runs locally.
      # It gates on the pre-release test suite, builds the Next.js standalone
      # frontend, bundles the backend with PyInstaller, then packages the app —
      # so CI can never drift from what's actually been verified on a machine.
      # Signing and notarization run only when the secrets are present, so a
      # fork or a pre-certificate build still produces a working (unsigned)
      # artifact instead of failing. electron-builder skips both silently when
      # the credentials are absent.
      - name: Build & package (mac)
        run: bash scripts/build-desktop.sh mac
        env:
          NEXT_TELEMETRY_DISABLED: 1
          USE_HARD_LINKS: false
          # Developer ID Application cert, base64-encoded .p12
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization via notarytool
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A signed-but-broken app is worse than an unsigned one: it only fails on
      # the customer's machine. Verify the signature and the Gatekeeper verdict
      # here, where a failure is cheap.
      - name: Verify signature and notarization
        run: |
          APP="dist-desktop/mac-arm64/Omnia Pathology AI.app"
          [ -d "$APP" ] || APP="dist-desktop/mac/Omnia Pathology AI.app"
          echo "── codesign ──"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true
          if codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "  UNSIGNED build (no certificate configured)."
            echo "  Gatekeeper will block this on a user machine — fine for CI, not for release."
            exit 0
          fi
          echo "── Gatekeeper ──"
          spctl -a -vvv -t install "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "accepted" /tmp/spctl.txt || { echo "  Gatekeeper REJECTED the app"; exit 1; }
          echo "  signed and accepted by Gatekeeper"

      # Attach straight to the GitHub Release rather than an Actions artifact.
      # Release assets live in separate storage from Actions artifacts, so a
      # ~270MB installer here never touches the (often very small) Actions
      # artifact storage quota — the thing that broke every prior release.
      - name: Grade a slide on macOS
        run: |
          # Must run inside the venv build-desktop.sh created — the system
          # interpreter has none of the packaged dependencies installed.
          source .venv/bin/activate
          pip install -q tifffile
          python3 tests/smoke_inference.py

      # Handed to the `publish` job rather than released from here. Two jobs
      # both creating the same release is a race: whichever arrived second
      # found it already existing, which surfaced intermittently as a failed
      # publish on an otherwise green build. Worse, publishing per-platform
      # meant a Windows failure still left the macOS installer released on its
      # own — a tagged version that shipped half its artifacts.
      #
      # retention-days: 1 keeps this out of the artifact storage quota that
      # broke earlier releases; the files only need to survive long enough for
      # the publish job to collect them.
      - name: Hand the DMG to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist-desktop/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Build & package (win)
        shell: bash
        run: bash scripts/build-desktop.sh win
        env:
          NEXT_TELEMETRY_DISABLED: 1
          USE_HARD_LINKS: false
          # Authenticode cert, base64-encoded .pfx. Absent -> unsigned build.
          CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Verify Windows signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-desktop -Filter "*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "  status : $($sig.Status)"
          Write-Host "  signer : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq "NotSigned") {
            Write-Host "  UNSIGNED build (no certificate configured)."
            Write-Host "  SmartScreen will warn on a user machine."
            exit 0
          }
          if ($sig.Status -ne "Valid") { throw "Signature is $($sig.Status), not Valid" }
          Write-Host "  signature valid"

      # A PE-header check only proves the file is a Windows binary. It passed
      # happily for builds whose backend could not load OpenSlide and so could
      # not open a single slide — the app's entire purpose. This actually runs
      # the bundled backend and asks it whether its own dependencies loaded.
      - name: Smoke test the bundled backend
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "omnia-backend*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No backend executable found in dist/" }
          Write-Host "Starting $($exe.Name) ($([math]::Round($exe.Length / 1MB, 0)) MB)..."

          $env:OMNIA_DATA_DIR = "$env:RUNNER_TEMP\omnia-smoke"
          $env:PORT = "8123"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow

          try {
            # First start unpacks the onefile bundle, which is slow on CI.
            $ready = $false
            foreach ($i in 1..180) {
              Start-Sleep -Seconds 1
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8123/health" -TimeoutSec 3
                if ($h.status -eq "ok") { $ready = $true; Write-Host "Backend answered after ${i}s"; break }
              } catch { }
            }
            if (-not $ready) { throw "Backend never became healthy" }

            # preflight reports the real state of every dependency grading
            # needs: storage, the OpenSlide native library, torch, and the
            # bundled model checkpoint.
            $pf = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/system/preflight" -TimeoutSec 30
            $failed = @()
            foreach ($c in $pf.checks) {
              $mark = if ($c.ok) { "PASS" } else { if ($c.fatal) { "FAIL" } else { "WARN" } }
              Write-Host ("  {0,-5} {1,-12} {2}" -f $mark, $c.key, $c.detail)
              if (-not $c.ok -and $c.fatal) { $failed += $c.key }
            }
            if ($failed.Count -gt 0) {
              throw "Bundled backend is missing required components: $($failed -join ', ')"
            }
            Write-Host "All grading-critical components loaded inside the Windows build."
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      # Preflight proves the dependencies loaded. It does not prove a slide can
      # be graded: OpenSlide reporting a version means the DLL loaded, not that
      # its driver can open a slide and read tiles, and importing torch is not
      # a forward pass. This runs the real path end to end on Windows.
      - name: Grade a slide on Windows
        shell: bash
        run: |
          # Same venv as the packaged build; bash so the activate path matches
          # what build-desktop.sh created.
          source .venv/Scripts/activate
          pip install -q tifffile
          python tests/smoke_inference.py

      - name: Validate installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-desktop -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer found in dist-desktop/" }
          $header = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) { throw "Invalid PE header" }
          Write-Host "Installer: $($exe.Name) - $([math]::Round($exe.Length / 1MB, 0)) MB"

      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 1

  # One job, after both platforms have built and passed their smoke tests, so
  # a release either contains both installers or is never created at all.
  publish:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Show what will be released
        run: ls -lh installers/

      - name: Publish both installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Omnia Pathology AI ${{ github.ref_name }}
          body: See commit log for changes.
          files: |
            installers/*.dmg
            installers/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
